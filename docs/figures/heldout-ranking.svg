<svg xmlns="http://www.w3.org/2000/svg" width="640" height="860" viewBox="0 0 640 860" role="img" aria-labelledby="title desc">
<title id="title">Product Catalog Search: shared ranks and lexical failure cases</title>
<desc id="desc">On 19 answerable held-out queries, both TF-IDF and BM25 have the same first-relevant ranks: rank 1: 17, rank 2: 1, rank 3: 0, rank 4: 1, rank 5: 0; absent from top 5: 0. MRR@5 0.9342; Recall@5 1.0000. This is a tiny synthetic author-labelled demo, not an independent benchmark or evidence of method superiority.</desc>
